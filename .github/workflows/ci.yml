name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest, platform: "linux/amd64,linux/arm64" }
          - { name: macOS development, os: macos-latest, platform: "darwin/universal" }
          - { name: Windows, os: ubuntu-latest, platform: "windows/amd64,windows/arm64" }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS for Windows installers
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis
      - name: Fetch locked cores
        run: |
          IFS=, read -ra platforms <<< "${{ matrix.platform }}"
          for platform in "${platforms[@]}"; do
            go run ./cmd/fetch-core -platform "$platform"
          done
      - name: Build packages
        run: go tool mygo build -platform "${{ matrix.platform }}"
      - name: Check Linux install and uninstall
        if: matrix.name == 'Linux'
        run: scripts/check-linux-install.sh
